# Menu Iniciar (renderizado por _includes/startmenu.html). "items" vira submenu; "sep: true" é separador.
# Folha: "url" (link, passa por relative_url) ou "open" (mesmos valores do desktop.yml / launch() no desktop.js).
- label: Programas
  icon: directory_closed-3
  items:
    - label: Acessórios
      icon: directory_closed-3
      items:
        - label: Jogos
          icon: joystick-3
          items:
            - { label: Campo Minado, icon: game_mine_1-0, open: mines }
            - { label: 3D Pinball, icon: pinball, open: pinball }
            - { label: SkiFree, icon: skifree, open: skifree }
        - { label: Bloco de Notas, icon: notepad-3, open: notepad }
        - { label: Paint, icon: mspaint_2-3, open: paint }
        - { label: WordPad, icon: write_wordpad-1, open: wordpad }
    - label: Internet
      icon: directory_closed-3
      items:
        - { label: Netscape Navigator, icon: world-3, open: browser }
        - { label: mIRC, icon: mirc, open: mirc }
    - { label: Winamp, icon: winamp, open: winamp }
    - { label: MS-DOS Prompt, icon: ms_dos-1, open: dos }
- label: Favoritos
  icon: html-3
  url: /favoritos/
- label: Documentos
  icon: directory_open_file_mydocs-3
  items:
    - { label: Arquivo, icon: directory_open_file_mydocs-3, url: /arquivo/ }
    - { label: Fragmentos.txt, icon: notepad_file-1, url: /fragmentos/ }
    - { label: Canais (RSS), icon: channels-3, url: /feed.xml }
- label: Ajuda
  icon: help_book_big-0
  url: /sobre/
- sep: true
- label: Desligar...
  icon: shut_down_normal-3
  open: shutdown

# Ícones do desktop e do menu Iniciar, na ordem em que aparecem.
# Use "url" (abre na janela do Netscape) ou "open": browser | dos | dlg:<id> (template #tpl-dlg-<id> no default.html).
# "hide_menu: true" tira o item do menu Iniciar (fica só no desktop). As seções do site não
# aparecem aqui: ficam só dentro do Netscape (Personal Toolbar e sidebar).
# Ícones: assets/icons/<icon>.png (set Windows 98 de windowsicons.alexmeub.com).
- label: Meu Computador
  icon: computer_explorer-3
  open: dlg:about
- label: Netscape Navigator
  icon: world-3
  open: browser
- label: MS-DOS Prompt
  icon: ms_dos-1
  open: dos
- label: Lixeira
  icon: recycle_bin_empty-3
  open: dlg:trash
  hide_menu: true
- label: Bloco de Notas
  icon: notepad-3
  open: notepad
- label: Fragmentos.txt
  icon: notepad_file-1
  url: /fragmentos/
- label: Arquivo
  icon: directory_open_file_mydocs-3
  url: /arquivo/
- label: Sobre
  icon: msg_information-1
  url: /sobre/
- label: Favoritos
  icon: html-3
  url: /favoritos/
- label: Canais
  icon: channels-3
  url: /feed.xml

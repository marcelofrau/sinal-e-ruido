<article class="fragment-card">
  <div class="fc-title"><img src="{{ '/assets/icons/notepad-3.png' | relative_url }}" alt="" width="16" height="16"><span>{{ include.post.title | default: 'fragmento' }}.txt - Bloco de Notas</span></div>
  <div class="fc-menu" aria-hidden="true"><u>A</u>rquivo <u>E</u>ditar <u>P</u>esquisar <u>A</u>juda</div>
  <div class="fc-body">{{ include.post.content }}</div>
  <div class="fc-meta"><a href="{{ include.post.url | relative_url }}" data-popup>{{ include.post.date | date: '%d/%m/%Y %H:%M' }} &middot; abrir</a></div>
</article>

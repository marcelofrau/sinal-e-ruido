# Ícones do desktop, na ordem em que aparecem (o menu Iniciar fica em startmenu.yml).
# Use "url" (abre na janela do Netscape) ou "open": browser | dos | dlg:<id> (template #tpl-dlg-<id> no default.html)
# ou o nome de um app (ver launch() no desktop.js). Poucos ícones, como no 98: cabem numa coluna
# ao lado do Netscape; o resto dos programas mora em Iniciar > Programas.
# As seções do site não aparecem aqui: ficam só dentro do Netscape (Personal Toolbar e sidebar).
# Ícones: assets/icons/<icon>.png (set Windows 98 de win98icons.alexmeub.com).
- label: Meu Computador
  icon: computer_explorer-3
  open: dlg:about
- label: Netscape Navigator
  icon: world-3
  open: browser
- label: Winamp
  icon: winamp
  open: winamp
- label: mIRC
  icon: mirc
  open: mirc
- label: WordPad
  icon: write_wordpad-1
  open: wordpad
- label: 3D Pinball
  icon: pinball
  open: pinball
- label: Lixeira
  icon: recycle_bin_empty-3
  open: dlg:trash
- label: Fragmentos.txt
  icon: notepad_file-1
  url: /fragmentos/
- label: Favoritos
  icon: html-3
  url: /favoritos/

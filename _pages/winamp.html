<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Winamp</title>
<style>html,body{height:100%;margin:0;background:#000}</style>
</head>
<body>
<div id="app"></div>
<!-- Webamp: skin Winamp 2 real em JS (MIT). Carrega só ao abrir o ícone Winamp. -->
<script src="https://unpkg.com/webamp@2.3.1/built/webamp.bundle.min.js"></script>
<script>
  if (typeof Webamp !== "undefined") {
    new Webamp({ initialWindowPosition: { top: 12, left: 12 } }).renderWhenReady(document.getElementById("app"));
  }
</script>
</body>
</html>

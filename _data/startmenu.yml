# Menu Iniciar (renderizado por _includes/startmenu.html). "items" vira submenu; "sep: true" é separador.
# Folha: "url" (link, passa por relative_url) ou "open" (mesmos valores do desktop.yml / launch() no desktop.js).
- { label: Windows Update, icon: windows_update_large-4, open: "dlg:update" }
- sep: true
- label: Programas
  icon: cool_25-3
  items:
    - label: Acessórios
      icon: cool_25-3
      items:
        - { label: Bloco de Notas, icon: notepad-3, open: notepad }
        - { label: Calculadora, icon: calculator-0, open: calc }
        - { label: Paint, icon: mspaint_2-3, open: paint }
    - label: Internet
      icon: cool_25-3
      items:
        - { label: Netscape Navigator, icon: world-3, open: browser }
        - { label: mIRC, icon: mirc, open: mirc }
    - label: Jogos
      icon: cool_25-3
      items:
        - { label: Campo Minado, icon: game_mine_1-0, open: mines }
        - { label: Paciência, icon: game_solitaire-0, open: sol }
        - { label: 3D Pinball, icon: pinball, open: pinball }
        - { label: SkiFree, icon: skifree, open: skifree }
    - { label: Winamp, icon: winamp, open: winamp }
    - { label: WordPad, icon: write_wordpad-1, open: wordpad }
    - { label: MS-DOS Prompt, icon: ms_dos-1, open: dos }
- sep: true
- label: Favoritos
  icon: directory_net_web-3
  url: /favoritos/
- label: Documentos
  icon: directory_open_file_mydocs-3
  items:
    - { label: Arquivo, icon: directory_open_file_mydocs-3, url: /arquivo/ }
    - { label: Fragmentos.txt, icon: notepad_file-1, url: /fragmentos/ }
    - { label: Canais (RSS), icon: channels-3, url: /feed.xml }
- label: Configurações
  icon: settings_gear-0
  items:
    - { label: Painel de controle, icon: directory_control_panel-4, open: "dlg:control" }
    - { label: Impressoras, icon: printer-2, open: "dlg:printers" }
    - { label: Restaurar janela do Netscape, icon: world-3, open: reset-browser }
- label: Localizar
  icon: search_file-1
  items:
    - { label: Arquivos ou pastas..., icon: search_file-1, url: /arquivo/ }
- { label: Ajuda, icon: help_book_big-0, open: help }
- { label: Executar..., icon: executable-0, open: run }
- sep: true
- { label: "Fazer logoff de Visitante...", icon: key_win-0, open: logoff }
- label: Desligar...
  icon: shut_down_normal-3

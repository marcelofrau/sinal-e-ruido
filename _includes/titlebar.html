{% comment %}Barra de título híbrida: gradiente do 98, ▼/▲ do 3.11 e o X de fechar do 98 (data-act="close"). Param: title.{% endcomment %}
<div class="win-title">
  <span class="win-caption">{{ include.title }}</span>
  <button class="win-min" type="button" aria-label="Minimizar"></button>
  <button class="win-max" type="button" aria-label="Maximizar"></button>
  <button class="win-close" type="button" data-act="close" aria-label="Fechar"></button>
</div>
